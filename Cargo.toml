[package]
name = "malta-tax"
version = "0.1.0"
edition = "2024"
description = "Estimates the income tax and Class 2 social security contributions of a self-occupied person in Malta"
authors = ["Georges Palauqui"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Georges760/malta-tax"
readme = "README.md"
keywords = ["malta", "tax", "self-employed", "social-security", "estimate"]
categories = ["command-line-utilities", "finance"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
